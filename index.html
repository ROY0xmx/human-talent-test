<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffaf4">
  <meta name="description" content="用轻松友好的测评发现你的十项天赋，获得个性化职业建议与成长分析。">
  <title>人类十大天赋自测 · 天赋小实验室</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="icon-refinement.css">
  <style>
    .quick-start-wrap{width:min(100%,720px);margin:24px auto 0;text-align:center}
    .quick-start-btn{width:100%;min-height:62px;padding:0 24px;display:flex;align-items:center;justify-content:center;gap:12px;border:0;border-radius:18px;background:linear-gradient(100deg,#e77b67,#ee9a78);color:#fff;font:inherit;font-size:19px;font-weight:800;box-shadow:0 10px 24px rgba(231,123,103,.25);cursor:pointer;transition:transform .18s,box-shadow .18s}
    .quick-start-btn:hover{transform:translateY(-2px);box-shadow:0 14px 28px rgba(231,123,103,.3)}
    .quick-start-btn:focus-visible{outline:3px solid #d88c6a;outline-offset:4px}
    .quick-start-note{display:block;margin-top:8px;color:var(--muted);font-size:12px}
    @media(max-width:600px){.quick-start-wrap{margin-top:18px}.quick-start-btn{min-height:58px;font-size:17px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button class="brand" id="homeBtn" type="button" aria-label="返回首页"><span class="brand-mark" aria-hidden="true">✳</span><span>天赋小实验室</span></button>
      <nav class="top-actions" aria-label="页面操作">
        <button class="icon-btn" id="historyBtn" type="button">测试记录</button>
        <button class="icon-btn round" id="themeBtn" type="button" aria-label="切换主题">☾</button>
      </nav>
    </header>

    <section class="screen active" id="homeScreen">
      <div class="hero">
        <span class="eyebrow">✦ 一次轻松的自我探索</span>
        <h1>人类十大天赋自测</h1>
        <p>没有标准答案，选择最像真实自己的选项。<br class="desktop-break">看见优势，也发现下一步可以发展的方向。</p>
      </div>
      <div class="talent-grid" aria-label="人类十大天赋">
        <article class="talent-tile coral"><span class="tile-icon" aria-hidden="true">▤</span><span>语言</span></article>
        <article class="talent-tile blue"><span class="tile-icon" aria-hidden="true">▧</span><span>逻辑</span></article>
        <article class="talent-tile violet"><span class="tile-icon" aria-hidden="true">◆</span><span>空间</span></article>
        <article class="talent-tile pink"><span class="tile-icon" aria-hidden="true">♫</span><span>音乐</span></article>
        <article class="talent-tile amber"><span class="tile-icon" aria-hidden="true">♟</span><span>身体</span></article>
        <article class="talent-tile teal"><span class="tile-icon" aria-hidden="true">♧</span><span>人际</span></article>
        <article class="talent-tile orange"><span class="tile-icon" aria-hidden="true">◉</span><span>内省</span></article>
        <article class="talent-tile green"><span class="tile-icon" aria-hidden="true">♧</span><span>自然</span></article>
        <article class="talent-tile lime"><span class="tile-icon" aria-hidden="true">♙</span><span>创造</span></article>
        <article class="talent-tile mauve"><span class="tile-icon" aria-hidden="true">●</span><span>美学</span></article>
      </div>
      <div class="quick-start-wrap">
        <button class="quick-start-btn" id="quickStartBtn" type="button"><span>开始测试</span><span aria-hidden="true">→</span></button>
        <span class="quick-start-note">点击立即开始，或在下方选择题量</span>
      </div>
      <p class="talent-caption">选一套适合自己的题目，开始认识天赋</p>
      <section class="home-controls" aria-label="选择测试题量并开始">
        <div class="version-grid" id="versionGrid" aria-label="选择测评长度">
          <button class="version-card" type="button" data-version="40" aria-pressed="false"><strong>40 题</strong><span>轻松体验 · 约 5 分钟</span><small>约 1000 字解析</small></button>
          <button class="version-card selected" type="button" data-version="100" aria-pressed="true"><span class="popular">推荐</span><strong>100 题</strong><span>标准测评 · 约 12 分钟</span><small>约 4000 字解析</small></button>
          <button class="version-card" type="button" data-version="200" aria-pressed="false"><strong>200 题</strong><span>深度探索 · 约 25 分钟</span><small>约 8000 字解析</small></button>
        </div>
        <button class="primary-btn start-btn" id="startBtn" type="button"><span>开始测试</span><span aria-hidden="true">→</span></button>
        <span class="privacy">⌑ 测试记录仅保存在此设备，可随时查看或清除</span>
      </section>
    </section>

    <section class="screen quiz-screen" id="testScreen" aria-labelledby="questionText">
      <div class="quiz-heading"><div><span class="eyebrow">✦ 跟随直觉，选择最像你的答案</span><p class="question-kicker" id="questionKicker"></p></div><button class="back-home" id="quizHomeBtn" type="button">退出测试</button></div>
      <div class="progress-row"><div class="progress-track"><div class="progress-bar" id="progressBar"></div></div><div class="progress-text" id="progressText">1 / 100</div></div>
      <h2 class="question" id="questionText"></h2>
      <div class="answer-hint">请选择最符合你真实状态的一项</div>
      <div class="options" id="options"></div>
      <div class="test-actions"><button class="secondary-btn" id="prevBtn" type="button">← 上一题</button><button class="primary-btn" id="nextBtn" type="button" disabled>下一题 →</button></div>
    </section>

    <section class="screen report-screen" id="reportScreen" aria-live="polite">
      <div id="reportContent"></div>
      <div class="report-actions"><button class="primary-btn" id="restartBtn" type="button">再测一次</button><button class="secondary-btn" id="reportHistoryBtn" type="button">查看历史</button></div>
    </section>

    <section class="screen history-screen" id="historyScreen">
      <div class="history-head"><span class="eyebrow">✦ 我的成长轨迹</span><h1>测试历史</h1><p>每一次探索，都是更了解自己的一步。</p></div>
      <div class="history-list" id="historyList"></div>
      <div class="history-actions"><button class="secondary-btn" id="historyHomeBtn" type="button">返回首页</button><button class="secondary-btn danger-btn" id="clearHistoryBtn" type="button">清除全部历史</button></div>
    </section>
  </main>
  <script src="talents.js"></script>
  <script src="app.js"></script>
  <script src="start-entry.js"></script>
</body>
</html>
